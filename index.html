<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Something new is on the way." />
    <title>Coming Soon — Webbuilder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      :root {
        color-scheme: dark;
        --bg: #0a0a0c;
        --text: #f4f2ef;
        --muted: rgba(244, 242, 239, 0.55);
        --accent: #c9a962;
        --glow: rgba(201, 169, 98, 0.35);
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: "DM Sans", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        position: relative;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2.5rem 1.5rem;
        overflow: hidden;
      }

      .page::before {
        content: "";
        position: absolute;
        inset: -40%;
        background:
          radial-gradient(ellipse 50% 40% at 50% 0%, var(--glow), transparent 70%),
          radial-gradient(circle at 80% 90%, rgba(80, 100, 140, 0.15), transparent 45%),
          radial-gradient(circle at 10% 70%, rgba(201, 169, 98, 0.08), transparent 40%);
        pointer-events: none;
      }

      .grain {
        position: absolute;
        inset: 0;
        opacity: 0.04;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        pointer-events: none;
      }

      main {
        position: relative;
        z-index: 1;
        max-width: 36rem;
        text-align: center;
      }

      .eyebrow {
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--accent);
        margin: 0 0 1.25rem;
      }

      h1 {
        font-family: "Instrument Serif", Georgia, serif;
        font-size: clamp(2.75rem, 8vw, 4.25rem);
        font-weight: 400;
        line-height: 1.08;
        margin: 0 0 1.25rem;
        letter-spacing: -0.02em;
      }

      h1 em {
        font-style: italic;
        color: var(--muted);
      }

      .lead {
        font-size: 1.0625rem;
        color: var(--muted);
        margin: 0 0 2.5rem;
        max-width: 28rem;
        margin-left: auto;
        margin-right: auto;
      }

      .notify {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
        align-items: stretch;
        max-width: 22rem;
        margin: 0 auto;
      }

      .notify input {
        flex: 1 1 12rem;
        min-width: 0;
        padding: 0.875rem 1rem;
        border: 1px solid rgba(244, 242, 239, 0.12);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        font: inherit;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      .notify input::placeholder {
        color: rgba(244, 242, 239, 0.35);
      }

      .notify input:focus {
        border-color: rgba(201, 169, 98, 0.5);
        box-shadow: 0 0 0 3px rgba(201, 169, 98, 0.12);
      }

      .notify button {
        padding: 0.875rem 1.5rem;
        border: none;
        border-radius: 999px;
        background: var(--accent);
        color: #0a0a0c;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
        transition: transform 0.15s, filter 0.15s;
      }

      .notify button:hover {
        filter: brightness(1.08);
      }

      .notify button:active {
        transform: scale(0.98);
      }

      .hint {
        margin-top: 1rem;
        font-size: 0.8125rem;
        color: rgba(244, 242, 239, 0.35);
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      footer {
        position: relative;
        z-index: 1;
        margin-top: auto;
        padding-top: 3rem;
        font-size: 0.8125rem;
        color: rgba(244, 242, 239, 0.3);
      }

      @media (prefers-reduced-motion: no-preference) {
        main {
          animation: fade 1s ease-out both;
        }

        @keyframes fade {
          from {
            opacity: 0;
            transform: translateY(12px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="grain" aria-hidden="true"></div>
      <main>
        <p class="eyebrow">Webbuilder</p>
        <h1>Something <em>beautiful</em> is coming.</h1>
        <p class="lead">
          We’re crafting a new way to build on the web. Check back soon — or leave
          your email and we’ll let you know when we launch.
        </p>
        <form class="notify" action="#" method="post" onsubmit="return false;">
          <label for="email" class="visually-hidden">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
          />
          <button type="submit">Notify me</button>
        </form>
        <p class="hint">No spam — just one note when we’re live.</p>
      </main>
      <footer>&copy; <span id="year"></span> Webbuilder</footer>
    </div>
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
